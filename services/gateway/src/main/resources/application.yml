server:
  # 8088: the single front door, after the services on 8080-8085.
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: gateway
  threads:
    # Each proxied request holds a thread for its whole duration, and a notification stream (SSE)
    # can stay open for many minutes. Virtual threads make that cheap.
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Default run uses the in-process limiter; no Redis to health-check.
    # Re-enabled under the `redis` profile (which runs Redis).
    redis:
      enabled: false

app:
  ratelimit:
    # Token buckets: burst up to `capacity`, then paced to `refill-per-second`.
    enabled: ${RATELIMIT_ENABLED:true}
    # Every request, per client IP and (when signed in) per user.
    capacity: ${RATELIMIT_CAPACITY:100}
    refill-per-second: ${RATELIMIT_REFILL_PER_SECOND:50}
    # Login / signup / refresh, per client IP: 10 at once, then one every 5 seconds.
    auth-capacity: ${RATELIMIT_AUTH_CAPACITY:10}
    auth-refill-per-second: ${RATELIMIT_AUTH_REFILL_PER_SECOND:0.2}
    # POST / PUT / PATCH / DELETE, per user: 30 at once, then one every 2 seconds.
    write-capacity: ${RATELIMIT_WRITE_CAPACITY:30}
    write-refill-per-second: ${RATELIMIT_WRITE_REFILL_PER_SECOND:0.5}
  jwt:
    # MUST match the Identity service's secret so the gateway can verify its tokens.
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-please-min-32-bytes-long-0123456789}
    issuer: vertex-identity
  gateway:
    # Public service name -> downstream base URL. /api/<name>/<rest> forwards to <base-url>/<rest>.
    # Defaults are localhost for `./mvnw spring-boot:run`; docker-compose overrides with service DNS.
    routes:
      identity: ${IDENTITY_BASE_URL:http://localhost:8080}
      profile: ${PROFILE_BASE_URL:http://localhost:8081}
      graph: ${GRAPH_BASE_URL:http://localhost:8082}
      feed: ${FEED_BASE_URL:http://localhost:8083}
      notify: ${NOTIFY_BASE_URL:http://localhost:8084}
      recommend: ${RECOMMEND_BASE_URL:http://localhost:8085}
    # Never forwarded from outside: each service's actuator (metrics, health details) and Notify's
    # raw event-ingest endpoint, which would let any signed-in user notify anyone about anything.
    blocked-paths:
      - /api/*/actuator
      - /api/*/actuator/**
      - /api/notify/v1/events
    # Header carrying the real client IP from a trusted edge. Blank = use the TCP peer address.
    # Production sets it (see deploy/), because there every request arrives through the tunnel.
    client-ip-header: ${CLIENT_IP_HEADER:}

---
# Redis profile: distributed rate limiting shared across gateway instances (docker-compose uses it).
# Activate with SPRING_PROFILES_ACTIVE=redis. Off by default so the JDK-only run needs no Redis.
spring:
  config:
    activate:
      on-profile: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
management:
  health:
    redis:
      enabled: true
