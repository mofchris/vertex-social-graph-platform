# Production overlay for the public demo, layered on ../docker-compose.yml:
#
#   docker compose --env-file deploy/.env -f docker-compose.yml -f deploy/compose.prod.yml up -d
#
# (deploy/vertex.sh wraps that.) Differences from local:
#   - nothing is published on the host: the only way in is the Cloudflare Tunnel below, which dials
#     out to Cloudflare, so the VM needs no open inbound ports;
#   - secrets (JWT key, database password, tunnel token) come from deploy/.env, which is not in git;
#   - the gateway trusts X-Vertex-Client-IP, which the edge Worker sets from Cloudflare's
#     CF-Connecting-IP, so rate limits are per visitor rather than per tunnel.

x-required-jwt: &jwt ${APP_JWT_SECRET:?set APP_JWT_SECRET in deploy/.env}

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
  redis:
    ports: !reset []
  kafka:
    ports: !reset []

  identity:
    ports: !reset []
    environment: { APP_JWT_SECRET: *jwt }
  profile:
    ports: !reset []
    environment: { APP_JWT_SECRET: *jwt }
  graph:
    ports: !reset []
    environment: { APP_JWT_SECRET: *jwt }
  feed:
    ports: !reset []
    environment: { APP_JWT_SECRET: *jwt }
  notify:
    ports: !reset []
    environment: { APP_JWT_SECRET: *jwt }
  recommend:
    ports: !reset []
    environment: { APP_JWT_SECRET: *jwt }

  gateway:
    ports: !reset []
    environment:
      APP_JWT_SECRET: *jwt
      CLIENT_IP_HEADER: X-Vertex-Client-IP
    networks:
      default:
        # Fixed address: the Workers VPC service that fronts the gateway is registered with it.
        ipv4_address: 172.30.0.10

  # Outbound-only connector for the Cloudflare Tunnel. The edge Worker reaches the gateway through
  # it via a Workers VPC service binding; no public hostname or DNS record is involved.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 128m
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in deploy/.env}
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
